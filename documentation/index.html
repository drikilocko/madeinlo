<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation — En construction · Made in Lo</title>
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <link rel="shortcut icon" href="../img/favicon.ico">
    <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
    <meta name="theme-color" content="#f7f2e9">
    <style>
        :root {
            --cream: #f7f2e9;
            --ink: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 16px;
        }

        .uc-logo {
            max-width: 72vw;
            width: 340px;
            height: auto;
        }

        .uc-text {
            position: fixed;
            bottom: 40px;
            left: 0;
            right: 0;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            color: #555;
        }

        .uc-text a {
            display: block;
            margin-top: 14px;
            font-size: 0.72rem;
            letter-spacing: 1px;
            color: #999;
            text-decoration: none;
        }

        .uc-text a:hover {
            color: var(--ink);
        }
    </style>
</head>

<body>
    <img class="uc-logo" src="../img/MADE_IN_LO_institutional_transparent.png" alt="Made in Lo">

    <div class="uc-text">
        Page en construction
        <a href="../index.html">Retour à la boutique</a>
    </div>
</body>

</html>
