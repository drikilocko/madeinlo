name: Supabase Keep-Alive

# Évite la mise en pause du projet Supabase (plan gratuit = pause après 7 jours d'inactivité).
# Ping l'API toutes les 72 h pour générer une requête réelle sur la base.

on:
  schedule:
    - cron: '0 6 */3 * *'   # tous les 3 jours à 06:00 UTC
  workflow_dispatch:         # permet aussi un lancement manuel

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping products API
        run: |
          echo "Ping $(date -u)"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            https://madeinlo.vercel.app/api/products)
          echo "HTTP status: $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
            echo "✅ Supabase actif"
          else
            echo "⚠️ Réponse inattendue ($code)"
            exit 1
          fi
