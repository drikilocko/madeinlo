<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Made in Lo - Connexion Partenaire</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-color: #ffffff;
            --primary-color: #8a6c0b;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 3rem;
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 3rem;
            display: block;
            color: #000;
            text-decoration: none;
        }

        h2 { margin-bottom: 2rem; font-size: 1.2rem; text-transform: uppercase; opacity: 0.5; }

        .form-group { margin-bottom: 1.5rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; font-weight: 600; }
        input {
            width: 100%;
            padding: 1rem;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        input:focus { border-color: var(--primary-color); }

        .login-btn {
            width: 100%;
            padding: 1.2rem;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s;
        }

        .login-btn:hover { background: var(--primary-color); }
        
        #error-msg { color: #ff5252; font-size: 0.85rem; margin-top: 1rem; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="index.html" class="logo">Made in Lo</a>
        <h2>Espace Partenaire</h2>

        <form id="login-form">
            <div class="form-group">
                <label>Identifiant Shop</label>
                <input type="text" id="login" required placeholder="ex: shop_lome_1">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn">Se connecter</button>
            <div id="error-msg">Identifiants incorrects. Veuillez réessayer.</div>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('api/shop-auth.php', {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', login, password })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    localStorage.setItem('shopId', data.shop_id);
                    localStorage.setItem('shopName', data.shop_name);
                    window.location.href = 'partner-dashboard.html';
                } else {
                    document.getElementById('error-msg').style.display = 'block';
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
    <script src="toast.js"></script>
</body>
</html>
